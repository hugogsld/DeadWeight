# Lint et tests a chaque PR et sur main. Aucune cle : les tests rejouent des reponses enregistrees.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: make lint
      - run: make test
